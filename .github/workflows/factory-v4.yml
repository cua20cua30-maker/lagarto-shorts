name: Lagarto Shorts Factory v4

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: lagarto-shorts-factory-v4
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install radar
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Foundation checks
        run: python scripts/healthcheck.py
      - name: Radar
        run: python scripts/radar_v2.py
      - name: Creator style learning
        run: python scripts/style_learner.py
      - name: Performance learning
        run: python scripts/learning_engine.py
      - name: Strategy generation
        run: python scripts/strategy_engine.py
      - name: Authorization-gated queue
        run: python scripts/factory_v3.py
      - name: Authorized media processing
        run: |
          if python -c "import json; print(bool(json.load(open('data/authorization_manifest.json', encoding='utf-8')).get('authorized_sources', [])))" | grep -q True; then
            python -m pip install --disable-pip-version-check faster-whisper
            python scripts/authorized_pipeline_v2.py
            python scripts/render_authorized_v2.py
          else
            python scripts/authorized_pipeline_v2.py
            python scripts/render_authorized_v2.py
          fi
      - name: Compile
        run: python -m compileall -q scripts
      - name: Pipeline self-test
        run: python scripts/pipeline_selftest.py
      - name: Persist state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/candidates.json data/learned_patterns.json data/edit_strategies.json data/render_queue.json data/publish_queue.json data/moments.json data/clip_plans.json config/creator_style_profiles.json
          if git diff --cached --quiet; then echo 'No state changes.'; else git commit -m 'Run factory v4'; git push; fi

name: Lagarto Shorts Factory v3

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: lagarto-shorts-factory-v3
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install radar tools
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Validate foundation
        run: python scripts/healthcheck.py
      - name: Run hardened radar
        run: python scripts/radar_v2.py
      - name: Learn creator style
        run: python scripts/style_learner.py
      - name: Learn performance patterns
        run: python scripts/learning_engine.py
      - name: Generate creator-aware strategies
        run: python scripts/strategy_engine.py
      - name: Build authorization-gated queues
        run: python scripts/factory.py
      - name: Run authorized media pipeline
        run: |
          if python -c "import json; print(bool(json.load(open('data/authorization_manifest.json', encoding='utf-8')).get('authorized_sources', [])))" | grep -q True; then
            python -m pip install --disable-pip-version-check faster-whisper
            python scripts/authorized_pipeline.py
          else
            python scripts/authorized_pipeline.py
          fi
      - name: Compile Python modules
        run: python -m compileall -q scripts
      - name: Integration self-test
        run: python scripts/selftest.py
      - name: Persist state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/candidates.json data/learned_patterns.json data/edit_strategies.json data/render_queue.json data/publish_queue.json data/analytics_snapshots.json data/moments.json data/clip_plans.json config/creator_style_profiles.json
          if git diff --cached --quiet; then echo 'No state changes.'; else git commit -m 'Run factory radar learning and authorized pipeline'; git push; fi

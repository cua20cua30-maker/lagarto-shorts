name: Lagarto Shorts Factory v5

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: lagarto-shorts-factory-v5
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: python -m pip install --disable-pip-version-check yt-dlp google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - name: Foundation
        run: python scripts/healthcheck.py
      - name: Radar
        run: python scripts/radar_v2.py
      - name: Learn creator style
        run: python scripts/style_learner.py
      - name: Learn performance patterns
        run: python scripts/learning_engine.py
      - name: Generate strategies
        run: python scripts/strategy_engine.py
      - name: Build gated queues
        run: python scripts/factory_v3.py
      - name: Process authorized sources
        run: |
          if python -c "import json; print(bool(json.load(open('data/authorization_manifest.json', encoding='utf-8')).get('authorized_sources', [])))" | grep -q True; then
            python -m pip install --disable-pip-version-check faster-whisper
          fi
          python scripts/authorized_pipeline_v2.py
          python scripts/render_authorized_v2.py
      - name: Publish when explicitly enabled
        env:
          YOUTUBE_AUTO_PUBLISH: ${{ secrets.YOUTUBE_AUTO_PUBLISH }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/publisher_v3.py
      - name: Validate pipeline
        run: |
          python -m compileall -q scripts
          python scripts/pipeline_selftest.py
      - name: Persist state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/candidates.json data/learned_patterns.json data/edit_strategies.json data/render_queue.json data/publish_queue.json data/moments.json data/clip_plans.json data/published.json config/creator_style_profiles.json
          if git diff --cached --quiet; then echo 'No state changes.'; else git commit -m 'Run complete Shorts factory pipeline'; git push; fi

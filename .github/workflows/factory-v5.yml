name: Lagarto Shorts Factory v5

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/factory-v5.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: lagarto-shorts-factory-v5
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Deno for YouTube extraction
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install tools
        run: python -m pip install --disable-pip-version-check yt-dlp google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib pillow
      - name: Verify runtime tools
        run: |
          python --version
          python -m pip --version
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Static Python validation
        run: python -m compileall -q scripts
      - name: Foundation
        run: python scripts/healthcheck.py
      - name: Discover verified Creative Commons sources
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/cc_source_discovery.py
      - name: Radar
        run: python scripts/radar_v2.py
      - name: Multisource radar
        run: python scripts/multisource_radar.py
      - name: Add verified licensed candidates
        run: python scripts/licensed_candidate_radar.py
      - name: Learn creator style
        run: python scripts/style_learner.py
      - name: Collect YouTube analytics
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/analytics_collector.py
      - name: Learn performance patterns
        run: python scripts/learning_engine.py
      - name: Generate strategies
        run: python scripts/strategy_engine.py
      - name: Build gated queues
        run: python scripts/factory_v3.py
      - name: Process authorized sources
        run: |
          if python -c "import json; a=bool(json.load(open('data/authorization_manifest.json', encoding='utf-8')).get('authorized_sources', [])); l=bool(json.load(open('data/licensed_sources.json', encoding='utf-8')).get('sources', [])); print(a or l)" | grep -q True; then
            python -m pip install --disable-pip-version-check faster-whisper bgutil-ytdlp-pot-provider
            rm -rf .pot-provider
            git clone --depth 1 --branch 2.0.0 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git .pot-provider
            cd .pot-provider/server
            deno install --allow-scripts=npm:canvas --frozen
            (cd node_modules && nohup deno run --allow-env --allow-net --allow-ffi=. --allow-read=. ../src/main.ts > ../../.bgutil-pot.log 2>&1 &)
            cd ../..
          fi
          python scripts/authorized_pipeline_v2.py
          python scripts/render_authorized_v2.py
      - name: Optimize trend hashtags
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/trend_hashtag_engine.py
      - name: Check YouTube OAuth readiness
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/youtube_auth_check.py
      - name: Publish when explicitly enabled
        env:
          YOUTUBE_AUTO_PUBLISH: ${{ secrets.YOUTUBE_AUTO_PUBLISH }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/publisher_v3.py
      - name: Monitor publication status and safe recovery
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/publication_monitor.py
      - name: Validate pipeline
        run: |
          python -m compileall -q scripts
          python scripts/pipeline_selftest.py
      - name: Update persistent run state
        if: always()
        env:
          PIPELINE_STATUS: ${{ job.status }}
        run: python scripts/persist_state.py
      - name: Persist state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json scripts/persist_state.py data/candidates.json data/licensed_sources.json data/multisource_diagnostics.json data/analytics_snapshots.json data/learning_records.json data/learned_patterns.json data/edit_strategies.json data/render_queue.json data/publish_queue.json data/moments.json data/clip_plans.json data/scream_events.json data/emotion_events.json data/hashtag_trends.json data/publication_recovery.json data/published.json config/creator_style_profiles.json
          if git diff --cached --quiet; then
            echo 'No state changes.'
          else
            git commit -m 'Run complete Shorts factory pipeline'
            git fetch origin main
            git rebase -X theirs origin/main
            git push
          fi
